[package]
name = "hetu"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
rfd = "0.17.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
